name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write

env:
  # gh CLI 认证与目标（草稿直传/发布收口共用）
  GH_TOKEN: ${{ github.token }}
  REPO: ${{ github.repository }}
  TAG: ${{ github.ref_name }}

jobs:
  # 草稿先行：Release 立即创建（自动日志此刻生成）；各打包腿直传 zip，绕开 artifact 中转
  # （download-artifact 对本仓库已两连挂——actions artifact 服务偶发不可用）。
  # 幂等：重跑时 view 命中即跳过创建。
  draft:
    name: 创建草稿 Release
    runs-on: ubuntu-latest
    steps:
      # 幂等：已存在（重跑）则 view 命中跳过创建
      - run: gh release view "$TAG" --repo "$REPO" || gh release create "$TAG" --repo "$REPO" --draft --generate-notes --title "$TAG"
        shell: bash

  # 三平台并行出 zip：sharp 原生件随构建机自动选择（build-release.mjs 按 process.platform/arch 过滤），
  # 文件名自带平台后缀（…-win-x64 / linux-x64 / linux-arm64），直传草稿无碰撞
  package:
    name: zip · ${{ matrix.zipname }}
    needs: draft
    runs-on: ${{ matrix.runs-on }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runs-on: ubuntu-latest
            zipname: linux-x64
          - runs-on: ubuntu-24.04-arm
            zipname: linux-arm64
          - runs-on: windows-latest
            zipname: win-x64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: node scripts/build-release.mjs
      # 直传草稿（--clobber 兜住重跑覆盖）；windows 默认 pwsh 不展开 glob，统一 bash
      - run: gh release upload "$TAG" dist-release/*.zip --clobber
        shell: bash

  # Docker 多架构镜像（自包含构建，与 zip 并行）：QEMU 出 arm64
  docker:
    name: 镜像 → GHCR
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Docker 多架构前置（buildx + QEMU）
        uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      # GHCR 登录：build-push-action 不自动认证，匿名推必 403
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Docker 镜像（linux/amd64 + arm64）推 GHCR
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ghcr.io/${{ github.repository_owner }}/zzlibrary:latest
            ghcr.io/${{ github.repository_owner }}/zzlibrary:${{ github.ref_name }}

  # 收口：zip 与镜像全部成功后发布（草稿转正）；幂等可重跑
  publish:
    name: 发布 Release
    needs: [package, docker]
    runs-on: ubuntu-latest
    steps:
      - run: gh release edit "$TAG" --repo "$REPO" --draft=false
        shell: bash
