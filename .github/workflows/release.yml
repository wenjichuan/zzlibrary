name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: 构建 release zip（bundle + web + 启动脚本）
        run: node scripts/build-release.mjs
      - name: Docker 多架构前置（buildx + QEMU）
        uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Docker 镜像（linux/amd64 + arm64）推 GHCR
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ghcr.io/${{ github.repository_owner }}/zzlibrary:latest
            ghcr.io/${{ github.repository_owner }}/zzlibrary:${{ github.ref_name }}
      - name: GitHub Release 挂 zip
        uses: softprops/action-gh-release@v2
        with:
          files: dist-release/*.zip
          generate_release_notes: true
